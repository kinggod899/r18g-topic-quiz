<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R18G 题材定位问卷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0a0d; --panel:#131119; --panel2:#1a1622; --line:#2b2633;
  --ink:#e9e3d9; --dim:#8e8699; --dim2:#625b70;
  --red:#b8432e; --red2:#d4553c; --gold:#c9a765;
}
html,body{background:var(--bg);color:var(--ink)}
body{
  font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 96px;
}
h1,h2,h3,.serif{font-family:"Songti SC","SimSun","Noto Serif SC",Georgia,serif;font-weight:400}
.wrap{max-width:900px;margin:0 auto;padding:0 22px}
a{color:var(--gold);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(11,10,13,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topin{max-width:900px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
.brand{font-size:13px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
.brand b{color:var(--ink);font-weight:400;letter-spacing:.14em}
.pbar{flex:1;height:2px;background:var(--line);position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--red2);transition:width .35s ease}
.tbtn{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:5px 11px;border-radius:2px;white-space:nowrap}
.tbtn:hover{color:var(--ink);border-color:var(--dim2)}

/* ---------- 封面 ---------- */
.cover{padding:88px 0 0}
.kicker{font-size:11px;letter-spacing:.3em;color:var(--red2);margin-bottom:22px}
.cover h1{font-size:44px;line-height:1.28;letter-spacing:.04em;margin-bottom:20px}
.cover h1 em{font-style:normal;color:var(--gold)}
.cover .lead{color:var(--dim);max-width:600px;font-size:15px;line-height:1.95}
.meta{display:flex;gap:36px;margin:42px 0 0;flex-wrap:wrap}
.meta div{font-size:12px;color:var(--dim2);letter-spacing:.08em}
.meta b{display:block;font-size:26px;color:var(--ink);font-weight:400;font-family:"Songti SC",serif;margin-bottom:2px}
.startrow{margin-top:52px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{
  display:inline-block;padding:13px 30px;border:1px solid var(--red);
  color:var(--ink);border-radius:2px;font-size:14px;letter-spacing:.1em;
  background:linear-gradient(180deg,#241417,#180f12);transition:.2s;
}
.btn:hover{border-color:var(--red2);background:#2a171b}
.btn[disabled]{opacity:.3;cursor:not-allowed;border-color:var(--line);background:var(--panel)}
.btn.ghost{border-color:var(--line);background:none;color:var(--dim)}
.btn.ghost:hover{color:var(--ink);border-color:var(--dim2)}
.note{font-size:12px;color:var(--dim2);line-height:1.9}

/* ---------- 题目 ---------- */
.step{padding-top:44px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stephead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.steptag{font-size:11px;letter-spacing:.24em;color:var(--red2)}
.stephead h2{font-size:26px;letter-spacing:.03em}
.stepdesc{color:var(--dim);font-size:13px;margin-bottom:34px;line-height:1.9}

.q{margin-bottom:40px}
.qh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.qn{font-size:11px;color:var(--red2);font-family:ui-monospace,monospace;padding-top:3px}
.qt{font-size:16px;letter-spacing:.02em}
.qq{font-size:12px;color:var(--dim2);margin:2px 0 14px 30px}
.opts{display:flex;flex-direction:column;gap:7px;margin-left:30px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hgroup{margin:0 0 16px 30px}
.gtitle{font-size:11px;letter-spacing:.24em;color:var(--red2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.hgroup .opt{padding:9px 12px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:11px 14px;
  border:1px solid var(--line);background:var(--panel);border-radius:2px;
  transition:.14s;cursor:pointer;position:relative;
}
.opt:hover{border-color:var(--dim2);background:var(--panel2)}
.opt .idx{font:11px ui-monospace,monospace;color:var(--dim2);min-width:16px;padding-top:2px}
.opt .txt{flex:1;font-size:14px;line-height:1.6}
.opt .sub{display:block;font-size:11.5px;color:var(--dim2);margin-top:2px;line-height:1.6}
.opt .mark{
  width:14px;height:14px;border:1px solid var(--dim2);border-radius:50%;
  flex:0 0 auto;margin-top:5px;position:relative;
}
.opt.on{border-color:var(--red);background:#1e1316}
.opt.on .mark{border-color:var(--red2);background:var(--red2)}
.opt.on .mark::after{content:"";position:absolute;inset:3px;background:#160d0f;border-radius:50%}
.opt.on .idx{color:var(--red2)}
.counter{font-size:11.5px;color:var(--dim2);margin:9px 0 0 30px;letter-spacing:.04em}
.counter b{color:var(--gold);font-weight:400}
.counter.bad b{color:var(--red2)}

/* ---------- 步进 ---------- */
.nav{display:flex;gap:12px;align-items:center;margin-top:16px;padding-top:26px;border-top:1px solid var(--line)}
.nav .hint{font-size:12px;color:var(--dim2);flex:1}
.nav .hint.bad{color:var(--red2)}

/* ---------- 结果 ---------- */
.res{padding-top:38px}
.res h2{font-size:30px;margin-bottom:8px;letter-spacing:.02em}
.res .sub{color:var(--dim);font-size:13px;margin-bottom:34px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px 22px;margin-bottom:14px}
.coords{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.coords div{background:var(--panel);padding:14px 16px}
.coords dt{font-size:11px;color:var(--dim2);letter-spacing:.14em;margin-bottom:4px}
.coords dd{font-size:13.5px;line-height:1.7}
.rank{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.row{background:var(--panel);padding:15px 18px;transition:.15s}
.row:hover{background:var(--panel2)}
.rowhead{display:flex;align-items:baseline;gap:12px;cursor:pointer}
.rk{font:11px ui-monospace,monospace;color:var(--dim2);min-width:18px}
.rname{font-size:16px;letter-spacing:.02em;flex:0 0 auto}
.rterm{font-size:11.5px;color:var(--dim2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rscore{font:11px ui-monospace,monospace;color:var(--gold);min-width:42px;text-align:right}
.rbar{height:2px;background:var(--line);margin:9px 0 0 30px;position:relative}
.rbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--red),var(--gold));width:0;transition:width .6s ease}
.rcore{font-size:13px;color:var(--dim);margin:10px 0 0 30px;line-height:1.75}
.rwhy{font-size:11.5px;color:var(--dim2);margin:6px 0 0 30px}
.exp{display:none;margin:16px 0 0 30px;padding:16px 18px;background:#0e0c11;border-left:2px solid var(--red)}
.exp.open{display:block}
.exp .lab{font-size:10.5px;letter-spacing:.2em;color:var(--red2);margin-bottom:5px}
.exp .val{font-size:13px;color:var(--dim);line-height:1.9;margin-bottom:14px}
.exp .val:last-child{margin-bottom:0}
.exp .val.txt{color:var(--ink);font-size:13.5px}
.pick{border:1px solid var(--red);background:linear-gradient(180deg,#1d1216,#141015)}
.pick .lab2{font-size:10.5px;letter-spacing:.26em;color:var(--red2);margin-bottom:12px}
.pick h3{font-size:24px;margin-bottom:6px}
.pick .core{color:var(--ink);font-size:14.5px;line-height:1.85;margin-bottom:20px}
.tbl{display:grid;grid-template-columns:88px 1fr;gap:2px 16px;font-size:13px}
.tbl dt{color:var(--dim2);font-size:11.5px;letter-spacing:.1em;padding-top:3px}
.tbl dd{color:var(--ink);line-height:1.8}
.todo{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.todo li{list-style:none;font-size:12.5px;color:var(--dim);padding:5px 0 5px 22px;position:relative}
.todo li::before{content:"□";position:absolute;left:0;color:var(--dim2)}
.vetoed{font-size:12.5px;color:var(--dim2);line-height:2}
.vetoed b{color:var(--dim);font-weight:400}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* ---------- 全谱 ---------- */
.atlas{padding-top:38px}
.atlas input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:11px 14px;border-radius:2px;font:inherit;font-size:14px;outline:none;margin-bottom:20px;
}
.atlas input:focus{border-color:var(--dim2)}
.aitem{background:var(--panel);border:1px solid var(--line);padding:16px 18px;margin-bottom:8px}
.aitem h4{font-size:15px;font-weight:400;margin-bottom:3px}
.aitem .term{font-size:11.5px;color:var(--gold);margin-bottom:10px;letter-spacing:.03em}
.aitem .ex{font-size:13px;color:var(--dim);line-height:1.9}
.aitem .ax{font-size:11px;color:var(--dim2);margin-top:9px;font-family:ui-monospace,monospace}
.hide{display:none!important}

@media(max-width:680px){
  .cover h1{font-size:32px}
  .opts.grid2{grid-template-columns:1fr}
  .rname{font-size:15px}
}
@media print{
  .top,.nav,.acts{display:none}
  body{background:#fff;color:#000}
}
</style>
</head>

2,"PROX":1,"SOC":1},"hooks":["BIRTH","MEDICAL","WET","MOTHER","INFANT"],"scene":"血泊、银剪、两日夜不灭的灯","beat":"胎位不正 → 侧切 → 婴儿落地那一声","term":"出産 / 分娩描写，難産","origin":"医学恐怖与猎奇（猟奇）交叉带；在 R18G 里属于生理实况派的根据地","explain":"产房被当作刑场使用：不是「生孩子很痛」这种常识，而是把分娩的全过程按解剖顺序摊开，让血、撕裂、排泄、失禁和新生同时发生。它和孕体题材共享同一个身体，但快感来源完全不同——孕体是「被占据的容器」，产房是「容器破裂的瞬间」。写这个题材必须敢写脏，回避排泄与撕裂就只剩煽情。"},{"n":4,"id":"CORPSE_WED","name":"与死者成婚","core":"合法的婚姻，对象已经凉了。仪式照常进行，宾客照常举杯。","axes":{"DEATH":2,"PROX":1,"SOC":2,"MIND":1},"hooks":["CORPSE_BRIDE","DEFILE_BODY","TIME","INCEST","PRIEST"],"scene":"殡仪馆、喜堂、双份的香烛","beat":"拜堂 → 扶不住的脖颈 → 喜被下的僵硬","term":"死体婚 / necrogamy，冥婚","origin":"中国民俗里的「冥婚」「配阴亲」，与日本「死体婚」同构；西方对应 corpse bride 传说","explain":"把婚姻制度套在死者身上：拜堂、合衾、入族谱、守寡——全套仪式一样不少，只是另一方已经不会呼吸。它比死姦冷得多，因为核心不是性而是「合法性」：一个活人被制度绑定给一具尸体，从此在法律与宗族意义上属于死人。真正的恐怖点在于「她此后每天的日常」，不是那一夜。"},{"n":5,"id":"TWIN_ECHO","name":"双生替身","core":"一个被使用，另一个必须看着。她们共享同一张脸，这就是刑罚。","axes":{"MIND":2,"PROX":2,"POC":1,"SOC":1},"hooks":["TWIN","WITNESS","DELUSION","SILENCE"],"scene":"镜前、并排的两张榻","beat":"点错人 → 认错人的沉默 → 被换上去的那一个","term":"双子 / doppelgänger，替身","origin":"哥特文学的双重人传统，日本同人的「双子姦」","explain":"存在两个高度相似的身体，于是其中一个可以被当作另一个的替代品消耗——杀了姐姐，妹妹补位；或者两个一起，让「不可替代」这个说法当场破产。它的快感是哲学性的：如果替换毫无障碍，那么被爱的从来不是这个人。与「借壳」的区别是：双生替身始终是两个真实的身体，借壳是一个身体被另一个意识占用。"},{"n":6,"id":"BODY_SWAP","name":"借壳","core":"身体是可以被搬走的东西。住进去的人用它做完了所有事，原主只能旁观。","axes":{"MIND":2,"BODY":1,"AES":1,"PROX":1},"hooks":["SELF","MECHANICAL","SILENCE","TWIN"],"scene":"手术台、镜中、出租的身体","beat":"签字 → 醒来不是自己 → 看着自己被人用","term":"憑依 / body swap，人格移植","origin":"日本「憑依」「乗っ取り」题材，英文圈 body swap / possession","explain":"意识被搬进另一具身体，于是施害者可以用受害者的手去毁掉受害者的生活。核心是「责任与身体的错位」：做了这些事的是这双手，法律上属于这个人，但里面住的是别人。它比双生替身更阴，因为受害者还活着，还被关在自己的身体里旁观。"},{"n":7,"id":"LIVESTOCK","name":"豢养","core":"人被当成畜产：编栏号、称重、配种、宰杀。制度越完整越恐怖。","axes":{"POC":2,"BODY":1,"SOC":1,"MIND":1},"hooks":["BEAST","SERVANT","MECHANICAL","INCONT","COLD"],"scene":"栏舍、检疫站、编号的铁牌","beat":"称重 → 烙印 → 第一次配种","term":"家畜化 / 畜奴，ペット化","origin":"BDSM 的 petplay 极端分支与战时「慰安」制度的文学变形","explain":"人被降到牲畜的分类里，于是饲养、配种、烙印、宰杀全部合乎「管理逻辑」。关键不在虐待，在分类：一旦归入牲畜，加害者不需要恶意，只需要勤勉。它和「豢养」类 SM 的区别是彻底性——SM 里宠物随时可以站起来说话，这里不行。"},{"n":8,"id":"AUCTION","name":"牲口拍卖","core":"验货、开价、落槌。人被摊开在台上，买家伸手翻检。","axes":{"POC":2,"SOC":2,"PROX":1},"hooks":["SERVANT","WITNESS","MECHANICAL","INCONT","COLD"],"scene":"拍卖台、验货的皮手套、木槌","beat":"开牙 → 摸身 → 落槌","term":"人身売買 / 竞拍，slave auction","origin":"奴隶贸易史的文学复现，日本「奴隷オークション」题材","explain":"把人放到台子上，按部位、年龄、用途逐项报价。真正的暴力是「被估价」这件事本身：她在被讨论斤两的时候还活着，还听得懂。与豢养的区别是公开性——拍卖必须有买家、有主持、有围观，是一场秩序完整的商业活动，不是私人癖好。"},{"n":9,"id":"RITUAL_SACRIFICE","name":"献祭","core":"毁形是有程序的。每一步都有颂词，每一步都为了让人活着被拆开。","axes":{"DEATH":2,"SOC":2,"BODY":1,"POC":1},"hooks":["SACRIFICE","PRIEST","REGICIDE","DEFILE_BODY","MECHANICAL"],"scene":"祭坛、石槽、诵经声","beat":"净身 → 开口 → 血顺着槽走","term":"生贄 / 活祭，human sacrifice","origin":"各文明的人祭记载（商代、阿兹特克、迦太基），日本「生贄」民俗","explain":"死亡被赋予宇宙论意义：不是被杀，是被献给。于是加害者不是凶手，是祭司；受害者不是被害者，是供品。它比普通处刑多一层「正当性包装」，也因此更冷——全程有祷词、有规程、有观礼者，恶被彻底制度化了。写好它的关键是让仪式真的有人信。"},{"n":10,"id":"PRIEST_CELL","name":"忏悔室与教权","core":"罪被说出来，然后被用来交换。赦免是有价钱的，付的是身体。","axes":{"SOC":1,"MIND":2,"PROX":2,"POC":1},"hooks":["PRIEST","DELUSION","WITNESS","SILENCE"],"scene":"告解格、烛、看不见脸的窗","beat":"说出罪 → 隔板打开 → 赎罪的姿势","term":"懺悔室 / 告解，教权题材","origin":"天主教告解制度与「神父-信众」权力结构，日本「懺悔室」成人题材","explain":"隔着一道栅栏，一个人必须把最羞耻的事说出来，另一个人有权赦免或不赦免。这里的暴力是话语的：坦白本身就是被剥夺。它不需要动手，只需要「你不说，罪就不消」这一条规则。教权题材的通用结构是——掌握赦免权的人，可以要求任何代价。"},{"n":11,"id":"SURGEON","name":"医者与病体","core":"白布、器械、知情同意。最文明的场景承载最原始的权力。","axes":{"BODY":2,"POC":1,"PROX":1,"MIND":1},"hooks":["MEDICAL","MECHANICAL","AMPUTATE","WOUND_SEX","WET"],"scene":"无影灯、脱毛的皮肤、托盘","beat":"划开 → 止血钳 → 缝合线穿过皮肉","term":"医療 / 手術，临床猎奇","origin":"18-19 世纪外科手术公开演示（解剖剧场），日本「醫療」「手術」系猎奇","explain":"以治疗之名行切割之实：麻醉、消毒、器械、缝合，全套专业流程一样不缺，只是病人从未同意。它与单纯切割的区别是「善意」——医者真心认为自己在救她。这种自我说服比恶意更可怕，因为它可以持续几十年而不厌倦。"},{"n":12,"id":"NEEDLE","name":"针刺与经络","core":"细密的侵入，一寸一寸。疼是准时的，快感是迟到的。","axes":{"BODY":2,"MIND":1,"PROX":1},"hooks":["NEEDLE","MECHANICAL","MEDICAL","SILENCE"],"scene":"银针、穴位图、被固定住的手腕","beat":"下针 → 捻转 → 拔出来的那一下","term":"針責め / 针刺，针刑","origin":"日本江户刑罚「針責め」，中国针灸经络体系被挪用的想象","explain":"用极细的侵入制造极端的痛：不留大伤口，不见大出血，只有针尖进入组织的精确位置。它天然带有「知识权力」——扎哪里最疼、扎多深不致命，需要专门训练。与切割题材的区别是：切割是减法（失去），针刺是加法（多了一个不该在里面的东西）。"},{"n":13,"id":"EYE_SCENE","name":"眼部","core":"剥夺目睹权。看不见的人，才最清楚正在发生什么。","axes":{"BODY":2,"MIND":1,"DEATH":1},"hooks":["EYE","MECHANICAL","DISFIGURE","WITNESS"],"scene":"蒙眼的布、困住的眼皮、镜片","beat":"被撑开 → 不能眨 → 光","term":"目玉 / eye trauma，眼部猎奇","origin":"猎奇（猟奇）绘画的固定母题，从《索多玛》到日本グロ系同人","explain":"眼睛同时是器官和隐喻：它是「看见」的器官，所以毁掉它等于毁掉见证能力。眼部题材的独特张力在于受害者往往是被迫睁着眼——加害者要她看着。写得好的眼部场景不写眼球本身，写「她之后再也无法确认别人在不在看她」。"},{"n":14,"id":"LIMB","name":"切割与残缺","core":"少了一部分的身体更好用。残肢成了新的接口。","axes":{"BODY":2,"DEATH":1,"POC":1},"hooks":["AMPUTATE","MEDICAL","DISFIGURE","MECHANICAL"],"scene":"锯、止血带、地上的形状","beat":"捆紧 → 锯 → 剩下的那截怎么办","term":"切断 / 截肢，amputee，リョナ","origin":"日本「リョナ」（ryona，虐待女性身体的专门分类）核心分支","explain":"以失去肢体来改变身体的形态与能力：一个人从此不能跑、不能抱、不能自己吃饭。它的核心不是血，是「永久性」——截掉的部分不会长回来，此后每一天都要面对这个减法。与去势的区别是功能指向：截肢砍的是行动力，去势砍的是生殖与性别位置。"},{"n":15,"id":"GELDING","name":"去势","core":"不是杀死，是把某种可能性永久摘掉。人还活着，只是从此不一样了。","axes":{"BODY":2,"POC":2,"PROX":1,"MIND":1},"hooks":["AMPUTATE","MEDICAL","MECHANICAL","SERVANT","COLD"],"scene":"宫刑房、烧红的铁、验身的人","beat":"按住 → 割 → 之后他怎么称呼自己","term":"去勢 / castration，宦官","origin":"宦官制度史（中国、拜占庭、奥斯曼），日本「去勢」系","explain":"不是杀，是「改造分类」：一个男性被从可繁殖的序列里划掉，成为可安全接近内廷的物件。它的暴力是社会学意义上的——去势之后他仍然活着，仍然有欲望，只是被制度判定为无害。写好它的关键在术后：他自己怎么看待自己剩下的部分。"},{"n":16,"id":"DISFIGURE","name":"毁容","core":"美被当场销毁。销毁者通常最爱这张脸。","axes":{"BODY":1,"PROX":2,"SOC":1,"MIND":1},"hooks":["DISFIGURE","WITNESS","DELUSION","SELF"],"scene":"铜镜、炭火、撕开的布","beat":"照镜子 → 抬手 → 之后她还愿不愿照","term":"顔面損壊 / disfigurement，毁容","origin":"战争创伤医学史，日本「顔面損壊」猎奇题材","explain":"毁掉的是「被识别」的能力。一个人的社会身份几乎全部挂在这张脸上，脸一毁，她作为「某人」就消失了，只剩一具还能用的身体。与截肢的区别在于社会性：断腿的人还是原来那个人，毁容的人不是了。"},{"n":17,"id":"DINNER","name":"宴席","core":"人被端上桌。席间所有人都在谈别的，这就是最狠的一层。","axes":{"SOC":2,"POC":2,"DEATH":1,"PROX":1},"hooks":["DINNER","WITNESS","SERVANT","PRIEST"],"scene":"长桌、银盖、祝酒词","beat":"揭盖 → 举筷 → 说好吃","term":"カニバリズム / cannibalism，食人宴","origin":"饥荒食人史、太平洋岛屿习俗记载、汉尼拔系流行文化","explain":"把一个人变成食物，于是处置流程从「埋葬」改为「烹饪」：分割、腌制、上桌、分食、评价味道。它的独特性是把暴力做成礼仪——有餐具、有座次、有祝酒词。与普通谋杀的区别是：食人不掩饰，它要求在场所有人共同完成。"},{"n":18,"id":"BEAST","name":"异种与兽性","core":"不是人的东西拥有人的身体。反抗没有对象，求饶没有语言。","axes":{"BODY":2,"MIND":1,"PROX":1},"hooks":["BEAST","WET","PARASITE","SILENCE"],"scene":"厩、林、被拴住的颈圈","beat":"靠近 → 气味 → 无法交流的那部分","term":"獣姦 / bestiality，异种","origin":"日本「獣姦」分类，西方 monster / tentacle 传统","explain":"用非人的身体来执行，于是「人的意图」被稀释：不是某个人想这么做，是某种本能或异物在做。这层稀释是它的功能——加害者可以把责任推给兽性或寄生体。与器械的区别是：器械是人造物的延伸，兽是另一个意志，无法完全控制。"},{"n":19,"id":"INSECT","name":"虫","core":"数量就是暴力。个体太小，所以无处可挡。","axes":{"BODY":2,"MIND":1},"hooks":["INSECT","PARASITE","WET","MECHANICAL"],"scene":"缝隙、皮下、灯下的一层","beat":"第一只 → 一整片 → 不再驱赶","term":"虫姦 / insect，虫使","origin":"日本「蟲」系猎奇与触手题材的近亲","explain":"用数量与细小的侵入制造失控：不是一次暴力，是成千上万次。虫的核心恐惧是「无法逐一抵抗」——你打不完。它比异种更脏、更接近腐败，因为虫与尸体共享同一套生态。"},{"n":20,"id":"MACHINE","name":"器械","core":"人退出以后，程序还在继续。谁是施害者已经说不清。","axes":{"BODY":2,"POC":1,"AES":1},"hooks":["MECHANICAL","WITNESS","COLD","MEDICAL"],"scene":"滑轮、刻度、定时","beat":"上架 → 启动 → 记录员在旁边写字","term":"機械姦 / machine，刑具","origin":"工业化的刑具史与日本「機械姦」分类","explain":"把加害动作交给装置，于是施害者退到操作位——他只需要设定参数、按下开关、然后旁观。这层「间接性」是它的核心快感：没有人亲手施暴，暴力却精确地持续进行。与器械刑具的差别在于持续性：人可以累，机器不会。"},{"n":21,"id":"GALLOWS","name":"绞杀与悬吊","core":"呼吸是可以被收取的东西。收的人不急，被收的人很急。","axes":{"DEATH":2,"POC":1,"BODY":1,"PROX":1},"hooks":["STRANGLE","REGICIDE","WITNESS","CORPSE_WET"],"scene":"白绫、绳结、脚下那块木板","beat":"收紧 → 失禁 → 松开以后的第一口气","term":"首絞め / 縊死，悬吊，hanging","origin":"欧洲公开绞刑史，日本「首絞め」成人题材中的窒息分支","explain":"勒住颈部造成缺氧，于是死亡变成一个可以被精确控制的过程：松一点是昏厥，紧一点是永久。它同时是处刑、是性、是掌控呼吸的权力。与斩首的区别是时间——绞杀有过程，过程里对方还活着，还能听见你说话。"},{"n":22,"id":"PUBLIC_SQUARE","name":"公开处刑","core":"围观者才是刑具。他们什么都不做，这就是参与。","axes":{"SOC":2,"POC":2,"PROX":1,"DEATH":1},"hooks":["WITNESS","REGICIDE","SERVANT","DISFIGURE"],"scene":"广场、告示、挤到前面的人","beat":"宣读 → 剥衣 → 底下有人笑","term":"公開処刑 / 示众，public execution","origin":"欧洲与中国的公开行刑传统（断头台、凌迟、枷号）","explain":"处刑的功能不是杀死，是给看的人看。因此广场题材的重心永远不在受刑者，在观众：谁在看、谁转过头、谁带着孩子来、谁在结束后去收尸。它的暴力是示范性的，目的是让所有人记住自己也可能站上去。"},{"n":23,"id":"WATCHER","name":"目击者的位置","core":"不参与的人也在被改造。看，是一种缓慢的性。","axes":{"MIND":2,"PROX":2,"AES":1},"hooks":["WITNESS","DELUSION","SILENCE","COLD"],"scene":"门缝、帘后、隔着屏风的椅子","beat":"看见 → 不动 → 事后自己手上的反应","term":"目撃 / 旁观视角，voyeurism","origin":"剧场与窥视理论的交叉，日本「目撃」系题材","explain":"把叙述位置放在一个不能介入的人身上：他看得见全过程，却没有权力阻止。这个位置的独特痛苦是「共谋感」——不作为也是一种参与。它与公开处刑的区别是：广场上有群众，这里只有一个目击者，安静得多，也脏得多。"},{"n":24,"id":"COLD_RECORD","name":"冷记录","core":"用卷宗、验尸单、日记的口吻写最脏的事。距离感就是快感。","axes":{"AES":2,"MIND":1,"SOC":1},"hooks":["COLD","MECHANICAL","MEDICAL","TIME"],"scene":"卷宗、判词、编号的物证袋","beat":"编号 → 记录 → 签字的那个人的呼吸","term":"記録体 / 档案体，case file","origin":"法医报告、验尸记录、审讯笔录的文体挪用","explain":"不写感受，只写条目：时间、部位、尺寸、状态、处置结果。暴力被压缩成表格，于是读者必须自己去补那层恐怖——这是它比煽情更狠的地方。写好它的唯一要求是准确：术语错一个，整份记录的权威就塌了。"},{"n":25,"id":"LOVE_DELUSION","name":"爱之妄念","core":"加害者坚信自己在爱。这份确信比任何刑具都锋利。","axes":{"MIND":2,"PROX":2,"SOC":1},"hooks":["DELUSION","LAUGH","MOTHER","SILENCE"],"scene":"温柔的手、做过头的照顾、收拾干净的屋子","beat":"他说爱我 → 他做的事 → 两者之间没有缝","term":"ヤンデレ / 病娇，爱之妄念","origin":"日本「ヤンデレ」（yandere）文化，从恋爱类作品的黑化分支独立成类","explain":"加害者真心相信自己在爱：所以伤害是「为你好」，监禁是「保护你」，杀是「让你永远属于我」。它的特殊性在于加害者的内在是完整的、自洽的、甚至温柔的——正因为如此，受害者无法用「你是坏人」来抵抗。与普通暴力的区别是：这里没有恶意，只有爱错位之后的形状。"},{"n":26,"id":"SERVANT_RING","name":"仆从合围","core":"动手的都是下人。主子只需要坐在那里，说一句「别弄死了」。","axes":{"POC":2,"SOC":2,"PROX":1},"hooks":["SERVANT","WITNESS","MECHANICAL","SILENCE"],"scene":"廊下、按住四肢的手、主位上的茶","beat":"吩咐 → 按住 → 主子没有抬头","term":"集団 / 轮番，仆从合围","origin":"宫廷与庄园的家仆制度，日本「集団」系题材","explain":"施害者不是一个人，是一整圈下人：他们递工具、按手脚、清理现场、彼此不说话。这种结构的恐怖在于「分工」——每个人只做自己那一小步，于是没有人觉得自己是凶手。与公开处刑的区别是：这里没有观众，只有执行者。"},{"n":27,"id":"RIVAL","name":"同侪在场","core":"被比较是比被使用更难忍的。两个人都在，才是完整刑具。","axes":{"PROX":2,"MIND":1,"SOC":1},"hooks":["WITNESS","TWIN","DELUSION","SILENCE"],"scene":"并排的膝、谁先出声","beat":"被点名 → 比较 → 输的那个还得谢恩","term":"当て馬 / 比较对象，同侪在场","origin":"竞争性羞辱题材，日本「当て馬」（陪衬马）一词","explain":"把另一个人放在旁边做参照：更年轻、更完整、更听话。她的存在本身就是刑罚——不需要动手，只要让她看见「本来可以是我」。与目击者的区别是位置：目击者在场外，同侪在同一个位置上，随时可能被替换。"},{"n":28,"id":"HUNGER","name":"饥饿","core":"胃口就是身体。饿到一定程度，什么都能吃，什么都能做。","axes":{"BODY":1,"SOC":1,"POC":1,"MIND":1},"hooks":["DINNER","BEAST","TIME","SELF"],"scene":"空锅、啃过的骨头、数着的日子","beat":"断粮 → 第一个提议 → 没人反对","term":"飢餓 / 断食，匮乏","origin":"饥荒史与苦修传统，日本「飢餓」系","explain":"用「没有」来施暴：没有食物、没有水、没有睡眠、没有遮蔽。身体开始吃自己——脂肪、肌肉、最后是器官。它的暴力是缓慢且无声的，所有伤害都由受害者的身体自己完成。与荒年的区别是规模：荒年是整片土地，饥饿是一个被锁起来的房间。"},{"n":29,"id":"PLAGUE","name":"疫病","core":"秩序先于人体崩坏。腐烂是慢的，慢得足够发生很多事。","axes":{"DEATH":1,"SOC":2,"BODY":1,"MIND":1},"hooks":["TIME","ROT","CORPSE_WET","MECHANICAL","COLD"],"scene":"封条、石灰、来不及埋的人","beat":"封门 → 里面的日子 → 最后一个还活着的","term":"疫病 / pestilence，检疫","origin":"黑死病、瘟疫史与隔离制度","explain":"疾病本身不构成题材，腐烂才构成。这个题材的快感有两个来源，必须分清：一是「秩序的失效」——城门封了、医生跑了、亲人不许靠近、尸体堆在街角；二是「有机物在变」，即腐坏本身：皮下往外走的气、颜色从青到黑、蛆把一个人变成一堆可以被铲走的东西。前者是社会学恐怖，后者是生理实况恐怖，写这个题材至少要写透一个。它与「事后」「冷记录」的分界正在这里：那两个处理的是「尸体——干净、可辨认、还有身份」，这里处理的是「尸体开始不再是那个人」。"},{"n":30,"id":"MOTHER_DAUGHTER","name":"母女","core":"爱的形式就是继承下来的暴力。她把受过的全套交给女儿。","axes":{"PROX":2,"MIND":2,"SOC":1},"hooks":["INCEST","MOTHER","DELUSION","SILENCE"],"scene":"梳头、束胸、教她怎么忍","beat":"教会 → 用上 → 她说「我这是为你好」","term":"母娘 / 母女","origin":"日本「母娘」分类，家庭内部权力结构的极端化","explain":"两代女性被放进同一个权力装置：母亲既是保护者又是共谋者，女儿既是受害者又是继承者。它比单纯的亲缘禁忌复杂，因为母女之间有一层「我曾经也是这样」的共感——母亲的沉默里既有恐惧，也有认命。"},{"n":31,"id":"FATHER_SON","name":"父子","core":"继承、阉割与取代。最像自己的人，必须被自己先动一次手。","axes":{"PROX":2,"POC":1,"MIND":1,"BODY":1},"hooks":["INCEST","AMPUTATE","DELUSION","WITNESS"],"scene":"祠堂、家法、递过来的刀","beat":"跪下 → 自己动手 → 他照做了","term":"父子，父权继承","origin":"宗法继承制度与父子关系的文学传统","explain":"父亲的权力来自「你是我造的」，于是他对儿子拥有近乎无限的处置权，同时又要儿子延续自己。这个题材的核心矛盾是：他必须毁掉儿子才能证明权力，又必须留下儿子才能证明自己存在过。"},{"n":32,"id":"MARRIAGE_BED","name":"婚床","core":"合法的地方最没有退路。所有的礼貌都只是慢一点。","axes":{"PROX":2,"SOC":1,"POC":1,"MIND":1},"hooks":["MOTHER","PREGNANT","DELUSION","WET"],"scene":"喜帐、合卺酒、窗外听房的人","beat":"关门 → 熄灯 → 天亮要见人","term":"初夜 / wedding night，洞房","origin":"各文化的初夜权（jus primae noctis）传说与婚俗","explain":"把暴力包装成仪式：红帐、喜烛、合衾酒，全套吉祥话一样不缺，然后门一关。它的独特之处是「合法性」——所有人都在外面等着祝福，没有人会来救。与婚配死者的区别是对方还活着，因此整个过程必须被双方共同演完。"},{"n":33,"id":"SILENT_SLAVE","name":"彻底的沉默","core":"她不再说话。不是因为不能说，是因为说出来没有用。","axes":{"MIND":2,"BODY":1,"PROX":1,"AES":1},"hooks":["SILENCE","INCONT","COLD","SELF"],"scene":"空白的脸、按时的动作","beat":"问 → 没有回答 → 继续","term":"無言 / 失语，彻底的沉默","origin":"日本「無言」系与失语症题材的交集","explain":"剥夺的不是声音，是「被听懂的可能」：割舌、失语、或者干脆没人相信她说的话。这个题材的恐怖在于它对读者也生效——叙述里那个人的内心是空的，你读到的只有别人对她的描述。与意识剥夺的区别是：她仍然清醒，只是无法出口。"},{"n":34,"id":"SELF_DESTRUCT","name":"自毁","core":"她自己动的手。这一层永远比外人施暴更让人合不上眼。","axes":{"MIND":2,"BODY":1,"PROX":1,"DEATH":1},"hooks":["SELF","DISFIGURE","SILENCE","NEEDLE"],"scene":"碎瓷、掌心、半夜的盆","beat":"她划下去 → 看着血 → 说没事","term":"自傷 / 自毁，self-destruction","origin":"自伤研究与「破滅願望」文学传统","explain":"加害者与受害者是同一个人。于是没有控诉对象，没有救援可能，也没有道德上的干净位置——读者只能看着她一步步拆掉自己。它比被害题材更难受，因为它取消了「如果当时有人阻止」这个安慰。"},{"n":35,"id":"BODY_HISTORY","name":"身体编年","core":"用疤痕、妊娠、伤口做时间轴。身体是唯一不会说谎的记录。","axes":{"BODY":2,"AES":1,"MIND":1,"DEATH":1},"hooks":["TIME","WET","MISCARRIAGE","COLD"],"scene":"同一件旧衣、逐年松掉的系带","beat":"第一道疤 → 第十道 → 她数得清","term":"身体史 / 経年，身体编年","origin":"医学史与「経年変化」题材，长期照护文学的反面","explain":"不在一个场景里爆发，而是把同一个身体按年记录：第一次受伤、第一次失效、第一次不被认出来。它的暴力是时间的暴力——没有凶手，只有日历。写好它必须敢跳年，让读者自己补上中间那几百个相似的日夜。"},{"n":36,"id":"FLUID_DIARY","name":"污物与失禁","core":"羞耻的实况：控制不住的那一部分，才是最诚实的证词。","axes":{"BODY":2,"PROX":2,"MIND":1},"hooks":["INCONT","WET","SERVANT","SILENCE"],"scene":"床单、地砖缝、来不及的那一步","beat":"忍不住 → 被看见 → 没人提","term":"スカトロ / scat，失禁，污物","origin":"日本「スカトロ」分类与排泄禁忌","explain":"用身体最不愿承认的排出物来取消尊严：尿液、粪便、呕吐、经血。它的核心不是脏，是「无法控制」——一个人连自己的出口都管不住，就彻底退出了「体面人」这个类别。与羞辱题材的区别是：羞辱还需要观众，失禁不需要，自己知道就够了。"},{"n":37,"id":"DROWNING","name":"溺与沉","core":"臣服是一种缺氧。下去的人不再挣扎，因为挣扎也没有用。","axes":{"DEATH":1,"BODY":1,"MIND":2,"PROX":1},"hooks":["STRANGLE","WET","SILENCE","BEAST"],"scene":"水面、浴桶、按住后颈的手","beat":"沉 → 冒泡 → 提起来的那口气","term":"溺死 / drowning，沉水","origin":"水刑史（浸水、水牢）与溺亡民俗","explain":"死亡发生在液体里：肺被灌满，挣扎变成气泡，最后安静。它的独特质感是「看得见却够不着」——水是透明的，旁观者能全程看清，但伸不进去手。与绞杀的区别是：绞杀靠压力，溺水靠填充。"},{"n":38,"id":"AFTERMATH","name":"事后","core":"最狠的一段在门关上以后：收拾、洗手、吃饭、明天照常。","axes":{"DEATH":2,"AES":1,"SOC":1,"MIND":1},"hooks":["DEFILE_BODY","TIME","COLD","SILENCE"],"scene":"水盆、拖把、第二天的早饭","beat":"收拾 → 洗手 → 照常","term":"後日譚 / aftermath，余波","origin":"战争文学与灾难报道的「之后」传统","explain":"不写事件本身，只写事件之后：清理、辨认、登记、埋葬、以及活着的人第二天怎么吃饭。它的暴力是延迟的——所有伤害都已经发生完了，你再心疼也改不了。这类题材最难写，因为它必须拒绝高潮。"},{"n":39,"id":"LULLABY","name":"摇篮与产声","core":"最软的东西被用最狠的方式。婴儿的哭声能给任何场景加压。","axes":{"PROX":2,"DEATH":1,"BODY":1,"SOC":1},"hooks":["INFANT","BIRTH","MOTHER","WET"],"scene":"摇篮、奶渍、被打断的那一次","beat":"孩子哭 → 伸手被按住 → 继续","term":"子守唄 / 摇篮曲，产声","origin":"各国摇篮曲传统与「母性」题材的暗面","explain":"用最柔软的形式包裹最硬的内容：哄睡的歌、摇篮、婴儿的第一声哭。它的力量来自反差——同一个声音既在安抚，也在宣告「你从此归我」。与母女题材的区别是重心：母女写权力关系，摇篮曲写「温柔的占有」。"},{"n":40,"id":"WINTER_FAST","name":"荒年","core":"资源就是身体。冬天很长，春天未必来。","axes":{"SOC":1,"BODY":1,"POC":1,"MIND":1},"hooks":["DINNER","TIME","BEAST","SELF"],"scene":"雪、空仓、烧掉的家具","beat":"算粮 → 少一个人 → 谁先","term":"飢饉 / famine，凶作","origin":"中国与欧洲的饥荒史（丁戊奇荒、爱尔兰大饥荒）","explain":"整片土地一起饿：树皮、观音土、易子而食。它的暴力没有施害者，只有气候、税赋和运粮的队伍。这类题材的写法是「记账」——谁家死了几口、哪一天开始吃牲口、第几天开始吃人，一笔一笔往下记，不评论。"},{"n":41,"id":"VORE","name":"整吞","core":"一个人被完整地吞进去，还活着。消化是接下来几天的事。","axes":{"BODY":2,"DEATH":1,"MIND":1,"POC":1},"hooks":["VORE","DINNER","BEAST","SILENCE"],"scene":"喉咙、胃袋、被撑起的轮廓","beat":"含住 → 咽下 → 里面的动静渐渐没有","term":"Vore / vorarephilia，丸呑み（marunomi）","origin":"2000 年代欧美兽圈（furry）与日本的丸吞文化合流而成；日语写作「丸呑み」，按吞入路径还细分 oral / anal / cock / unbirth 四种","explain":"与食人的关键差别是「完整性」：食人是把人切开处理，vore 是整个人进去，不减一块。于是恐怖点从「被吃」变成「在里面还活着，而外面看不出什么」。它分软硬两支：soft vore 完全不损伤，prey 在胃里清醒地等待；hard vore 则在吞的过程中就开始咀嚼撕裂。写这个题材不要写血腥，要写「腹部那个不属于她的形状在动」。"},{"n":42,"id":"UNBIRTH","name":"归胎","core":"被塞回子宫，重做一次未出生的东西。出口就是入口。","axes":{"BODY":2,"MIND":2,"PROX":1},"hooks":["UNBIRTH","VORE","MOTHER","SILENCE"],"scene":"产道、暗处、被合拢的腿","beat":"推进去 → 合拢 → 等她自己出来，或者不出来","term":"Unbirth / 逆産，归胎","origin":"vore 的衍生分支，与「rebirthing（重生）」互为表里；日本同人写作「逆産み」","explain":"路径反过来：不是从子宫出来，是被塞回子宫。这层的独特之处是「位置的荒谬」——一个已经出生、已经长大的人，被强行退回到「未出生」的状态。它同时是 vore 的分支和孕体题材的倒影：孕体写「里面的东西要出来」，归胎写「外面的东西被塞进去」。恐怖落点在「她曾经出来过」这件事上，所以身体记得正确的方向，而方向被否决了。"},{"n":43,"id":"INFLATION","name":"膨胀","core":"往身体里灌，直到它不再像身体。破裂是可预期的终点。","axes":{"BODY":2,"POC":1,"PROX":1},"hooks":["INFLATE","WET","MECHANICAL","BIRTH"],"scene":"皮下的纹路、灌口、量尺","beat":"接上 → 灌 → 皮肤开始发亮","term":"Inflation / 膨張，風船","origin":"欧美 body inflation 传统与日本「膨張」「風船腹」题材；细分有 air / water / cum inflation","explain":"往体腔里灌入气、水、精液或其他物质，直到腹部（或全身）变形。它与怀孕的区别是「没有理由」——孕体至少有一个孩子在里面，膨胀什么都没有，只是被灌满了。这种无目的性是它更脏的原因。越界到极端就是 popping：撑到破裂。写法上必须写皮肤的纹路、光泽、以及「她开始用两只手托着它走路」这种具体的重量感。"},{"n":44,"id":"REMODEL","name":"改造","core":"身体被重新设计成另一个用途。原来的功能是错的。","axes":{"BODY":2,"MIND":2,"POC":1},"hooks":["REMODEL","MEDICAL","MECHANICAL","OBJECT"],"scene":"图纸、缝合线、被标出的接口","beat":"画线 → 切开 → 装上去试一次","term":"人体改造 / body modification，人体錬成","origin":"日本「人体改造」「人体錬成」系，与欧美 body horror（柯南伯格一系）交叉","explain":"不是毁掉，是「重新设计」：把器官挪位、增加接口、改换用途。它与切割题材的差别是「有图纸」——改造者心里有一个目标形态，每一刀都朝着那个形态去。正因如此它比随机施暴更冷：所有痛苦都是有意义的，都被算进了成本。写它要写术后：她照着新身体的说明书，学着用自己。"},{"n":45,"id":"OBJECTIFY","name":"物化","core":"她是一件家具。这个说法不是比喻，是使用说明。","axes":{"MIND":2,"POC":2,"PROX":1},"hooks":["OBJECT","DOLL","SERVANT","SILENCE"],"scene":"椅背、脚凳、被擦干净的表面","beat":"摆好 → 坐上去 → 用完不管","term":"物化 / objectification，家具化（家具化調教）","origin":"BDSM 的 furniture play，日本「家具化」调教分类","explain":"字面意义上的把人当东西用：当椅子坐、当脚凳踩、当摆设放着。与豢养的区别是「用途」——豢养是畜产（有生命、要喂养、会繁殖），物化是器物（不需要活，只需要在那里）。这层的侮辱在于「不被需要活着」，她必须自己维持呼吸，才能继续当那把椅子。"},{"n":46,"id":"MEATHOOK","name":"肉钩","core":"用钩子把人挂起来，然后像处理牲口一样处理。重量全落在皮肉上。","axes":{"BODY":2,"DEATH":1,"POC":1,"SOC":1},"hooks":["HOOKPULL","WOUND_SEX","AMPUTATE","WITNESS"],"scene":"冷库、铁钩、离地的脚","beat":"下钩 → 挂起 → 开始分割","term":"肉鉤 / meathook，悬挂分割","origin":"屠宰场作业流程的直接挪用；日本猎奇（グロ）题材的固定场景","explain":"用钩子穿过皮肉把人挂起来，重量全由那一小块组织承担。它与普通悬吊的区别是「着力点」：绞刑着力在脖子（为了死），肉钩着力在肩背或跟腱（为了腾出手）。挂起来的人不是要死，是要被处理——像肉铺里挂着的那半扇。写法上重点在「离地的脚」和「钩子那一小块被拉长的皮肤」。"},{"n":47,"id":"BRANDING","name":"烙印","core":"在皮肤上留下归属的证明。烧进去的字，一辈子洗不掉。","axes":{"PROX":2,"BODY":1,"POC":1,"MIND":1},"hooks":["BRAND","BURN","DISFIGURE","SERVANT"],"scene":"烧红的铁、压住肩的手、焦味","beat":"按住 → 压下去 → 之后她自己去摸那道疤","term":"烙印 / branding，焼き印","origin":"牲畜烙印制度与近代刑罚（烙刑）的双重来源","explain":"用烧红的金属在皮肤 DEATH":2,"SOC":1},"hooks":["BURN","DISFIGURE","WITNESS","SACRIFICE"],"scene":"油、火把、焦黑的边","beat":"浇上 → 点着 → 退开看","term":"焼死 / immolation，火刑，焼身","origin":"火刑史（宗教裁判、火刑柱）与自焚抗议的两条互不相干的线","explain":"火与其他伤害的根本差别是「它会自己继续」：你点着之后就可以走开，伤害自行推进。这层「代理性」是它独特的快感——施害者不必在场，火替他做完剩下的一切。它与灼烧烙印的区别是范围：烙印要精确的一块，火刑要整个。写它必须写焦味先到、疼痛后到（烧伤毁掉神经，痛会迟到）。"},{"n":53,"id":"CRUSHING","name":"碾压","core":"不是切割，是压。骨头先断，形状随后改变。","axes":{"BODY":2,"DEATH":1,"POC":1},"hooks":["CRUSH","MECHANICAL","WITNESS","BEAST"],"scene":"石碾、车轮、脚下的地","beat":"放进去 → 压 → 声音先变，形状后变","term":"圧死 / crushing，圧殺，踏み潰し","origin":"F-List 的 crushing (living)；日本「踏み潰し」系与巨大化（macro）题材","explain":"不是切开，是压扁：骨头先断，内脏后挤，形状最后改变。与切割的区别是「没有出口」——切割让东西离开身体，碾压让东西留在里面被挤成一团。它的声音特征最强（骨裂、气从口鼻出来），所以写法上应该以听觉为主。巨物题材（macro）是它的幻想分支：不是为了性，是为了「她小到无法抵抗」。"},{"n":54,"id":"PARASITISM","name":"寄生","core":"身体里住进了别的东西。它需要她活着，但只需要她活着。","axes":{"BODY":2,"MIND":2,"PROX":1},"hooks":["PARASITE","INSECT","BIRTH","SILENCE"],"scene":"皮下走动的线、鼓起的腹、吐出","beat":"进去 → 长大 → 出来，或者不出来","term":"寄生 / parasitism，苗床，孕み袋","origin":"寄生蜂生物学的事实挪用；日本「寄生」「苗床」系与异种题材","explain":"有别的东西住在身体里，而且需要她活着。这层「需要」是全部恐怖来源——宿主不是被浪费掉的，是被维护的：喂她、给她保暖、防止她死，因为死了宿主就不新鲜了。与孕体的区别是「所有权」：孕体肚子里是加害者的骨血，寄生肚子里是不属于任何人的东西。写它要写「她在照顾自己体内的敌人」。"},{"n":55,"id":"MIND_BREAK","name":"心智崩坏","core":"不打身体，打里面那根轴。崩了以后她会笑着说谢谢。","axes":{"MIND":2,"PROX":2,"POC":1},"hooks":["MIND_BREAK","DELUSION","SILENCE","DOLL"],"scene":"重复的问话、被拿走的睡眠、空掉的眼睛","beat":"追问 → 拆开 → 她开始自己替他说完","term":"MIND BREAK / 精神崩壊，调教完成","origin":"日本成人游戏（eroge）的「調教」系统术语，指角色抵抗值归零的状态","explain":"不打身体，只打里面那根轴：剥夺睡眠、重复问话、制造不可预测的奖惩，直到她的判断系统失效。完成态的标志是「她开始主动配合并为此感激」。这是 R18G 里唯一一个「伤害全部发生在内部」的题材，也是唯一一个「加害者可能真心觉得自己在救她」的题材。写它的难度在于：崩坏必须是渐进的，每一步她都有看起来合理的理由。"},{"n":56,"id":"PUPPET","name":"人偶","core":"关节被换掉，动作由别人给。她还在里面，只是不再指挥。","axes":{"MIND":2,"BODY":1,"POC":2},"hooks":["DOLL","OBJECT","REMODEL","MECHANICAL"],"scene":"绳、关节、被摆好的坐姿","beat":"穿线 → 拉起 → 让她自己走两步","term":"人形化 / puppet，糸操り， dollification","origin":"BDSM 的 dollification 与日本「糸操り」「人形」题材","explain":"关节被替换或固定，动作由绳子、支架或别人代劳。与物化的区别是「还保留运动」——物化是完全静止的家具，人偶是「被操控着动」。这层的残忍在于她仍在里面：她清楚地知道是自己的手在抬起、但抬起这个决定不是她下的。写它要写「动作与意图之间的那道延迟」。"},{"n":57,"id":"BLUNT_TRAUMA","name":"钝击","core":"没有破口，没有血。打进去的东西在皮下继续坏。","axes":{"BODY":2,"POC":1,"PROX":1},"hooks":["BLUNT","CRUSH","WITNESS","MEDICAL"],"scene":"拳、靴底、腹部那块正在变色的皮肤","beat":"打上去 → 她还没倒 → 三天后内出血才要命","term":"腹パン（harapan）/ 钝击，blunt trauma","origin":"日本「腹パン」（打肚子）是 ryona 最基础也最普及的一支，在「ソフトリョナ」里排第一位；英文对应 blunt force trauma","explain":"与切割相反的伤害逻辑：不破皮、不见血，伤害发生在看不见的地方。它的独特性在于「时间差」——打上去的当下只有闷响和弯腰，真正的后果在几小时到几天后（内出血、脏器破裂、迟发性休克）才到。这正是它比刀更难写的原因：刀伤可以当场描写，钝击必须写「她以为没事」。与碾压的区别是着力面：碾压是持续的整体压力，钝击是一瞬间的局部冲击。它也是 ryona 的入门级：不需要 R-18G 的判定，光靠表情和姿势就成立。"},{"n":58,"id":"FLAYING","name":"剥皮","core":"皮是器官，不是包装。取下来以后人还活着，只是不能再被碰。","axes":{"BODY":2,"DEATH":1,"PROX":1,"SOC":1},"hooks":["FLAY","AMPUTATE","MEDICAL","WITNESS"],"scene":"钩子、刀锋走向、翻起来的那一层","beat":"划开 → 分离 → 她开始怕风","term":"皮はぎ（kawabagi）/ flaying，剥皮刑","origin":"中世纪欧洲与亚洲的剥皮刑史；美术史上最著名的是米开朗基罗《最后的审判》中提着自身人皮的圣巴多罗买","explain":"皮肤是人体最大的器官，也是唯一一个「取下来以后人还活着」的器官。这是剥皮与一切其他切割的分水岭：截肢拿走的是功能，剥皮拿走的是边界——她从此没有「里面」和「外面」的区分，风、空气、布料都成了侵入。与毁容的区别是范围：毁容针对脸（身份），剥皮针对全身（存在本身）。写法上必须写「取皮的技术」——历史上刽子手会尽量保持皮的完整，这份手艺的精确性才是恐怖的来源。"},{"n":59,"id":"IMPALEMENT","name":"贯穿","core":"东西留在里面，从另一头出来。她从此被固定在某个位置。","axes":{"BODY":2,"DEATH":1,"POC":1,"SOC":1},"hooks":["IMPALE","HOOKPULL","WITNESS","MECHANICAL"],"scene":"木桩、铁杆、被钉住的影子","beat":"对准 → 贯穿 → 她还得自己撑着不掉下去","term":"串刺し（kushizashi）/ impaled，贯穿刑，磔","origin":"欧洲的 impalement（弗拉德三世的名场面）与日本的磔刑；pixiv 有独立的「impaled」词条","explain":"关键不是刺入，是「留下」：异物停留在体内，从另一端出来，于是人被钉在某个位置。与针刺的区别是尺度与留存时间——针是细的、可以拔的，贯穿是粗的、拔了会死。与肉钩的区别是「支撑方式」：肉钩靠一小块皮肉承担体重，贯穿靠体腔内的杆子把人固定住。这类描写最狠的一点是「她还必须用力」——不使劲下滑，杆子会撕得更开。"},{"n":60,"id":"BURIAL","name":"活埋与幽闭","core":"刑具是空间本身。她动不了，也不知道外面过了多久。","axes":{"DEATH":2,"MIND":2,"BODY":1},"hooks":["BURY","DEPRIVE","SILENCE","STRANGLE"],"scene":"土、箱壁、越来越少的空气","beat":"盖住 → 等 → 她开始数自己的呼吸","term":"生き埋め（ikiume）/ 箱姦，活埋与幽闭，claustrophilia","origin":"活埋作为处刑在各文明都有记载；「箱姦」是日本同人对「装进箱子」这一支的称呼","explain":"刑具是空间本身，没有施害动作。这与一切「有人动手」的题材根本不同：施害者只需要把盖合上，然后走开。恐怖点分三层——物理的（空气变少）、时间的（不知道过了多久）、以及最深的那个：「没有人会来」。它与感官剥夺的区别是方向：剥夺拿走的是输入，幽闭拿走的是输出。"},{"n":61,"id":"FREEZING","name":"冻","core":"低温不制造伤口，它只是让一切慢下来，然后停下。","axes":{"BODY":2,"DEATH":2,"MIND":1},"hooks":["FREEZE","AMPUTATE","TIME","SILENCE"],"scene":"霜、发黑的指尖、开始不觉得冷的那一刻","beat":"降温 → 冻伤 → 她以为暖和了，那才是最危险的信号","term":"凍死（toushi）/ 凍傷，frostbite，hypothermia","origin":"冻死作为处刑与战争死因的记载；日本「凍死」「凍傷」猎奇分支","explain":"低温不制造伤口，它只是让一切变慢，然后停下。这与火构成一对反题：火是加速（焦黑、收缩、碳化），冻是减速（发白、发黑、坏死、脱落）。它最独特的一点是「濒死前的暖意」——严重失温时血管反常扩张，受害者会主观感到发热，甚至自己脱掉衣服。这是全世界寒冷死亡现场的共同现象，也是这个题材唯一无法被替代的场景。"},{"n":62,"id":"DEFORMITY","name":"畸形","core":"没有凶手。身体自己长成了不该长的样子，而这就是全部。","axes":{"BODY":2,"SOC":1,"MIND":1,"AES":1},"hooks":["DEFORM","MEDICAL","OBJECT","WITNESS"],"scene":"标本罐、幕布、不敢看的接生婆","beat":"生下来 → 被展示 → 她自己学着怎么遮","term":"奇形（kikei）/ deformity，畸形，freak show","origin":"畸形秀（freak show）的展览史；日本「奇形」与「見世物小屋」传统","explain":"这是全部题材里唯一「没有凶手」的一个：伤害不是谁造成的，是身体自己长成了不该长的样子。它的快感不在施暴，在「观看」与「被观看」——所以它天然带有展览结构（幕布、标本罐、收门票的人）。与改造的区别是时序：改造是先有正常再被改变，畸形是从一开始就是如此，因此没有「原本的样子」可以缅怀，这是它比改造更绝望的地方。"},{"n":63,"id":"HEMICORPORE","name":"半身","core":"腰以下没有了。她还活着，只是从此只能看着别人走路。","axes":{"BODY":2,"DEATH":1,"MIND":1},"hooks":["HEMICORP","AMPUTATE","MEDICAL","DEPRIVE"],"scene":"手术台、齐整的断面、轮椅","beat":"截断 → 缝合 → 她学会用手撑着自己移动","term":"hemicorporectomy / 半身切除，腰切り","origin":"医学上真实存在的手术（半体切除，切除骨盆以下全部），以及日本「腰切り」「半身」猎奇题材","explain":"截肢的极端形态：不是少一条腿，是少掉整个下半身，只保留腰以上。与普通截肢的区别不只是量，是「分类」——截肢者仍然是能移动的人（假肢或轮椅），半身切除者从此不属于任何既有的人类活动方式，必须重新发明移动、排泄、性。这个题材的写法只有一条路：写术后的日常技术细节，越具体越恐怖。"},{"n":64,"id":"VOMITING","name":"呕吐","core":"反向的排出。身体拒绝接受，而拒绝的样子本身被拿去用了。","axes":{"BODY":2,"PROX":2,"MIND":1},"hooks":["VOMIT","THROAT","INCONT","SILENCE"],"scene":"喉咙的痉挛、地上的那摊、被按回去的头","beat":"灌 → 拒绝 → 按回去继续","term":"嘔吐性愛（emetophilia）/ 反流","origin":"F-List 词表的 vomiting / swallowing vomit；日本「嘔吐」系","explain":"与失禁构成上下对称的一对：失禁是下端失控，呕吐是上端失控。但它比失禁多一层「拒绝」的语义——呕吐是身体在说「我不接受这个」，而当这个拒绝的动作本身被拿去使用（被按回去继续），「拒绝」就失效了。这是它比排泄题材更绝望的原因：连反抗的生理反应都被征用。"},{"n":65,"id":"NAIL_BED","name":"指甲","core":"最小的面积，最密的神经。取下来以后她连握都握不住。","axes":{"BODY":2,"PROX":1},"hooks":["NAIL","NEEDLE","MEDICAL","SILENCE"],"scene":"指尖、钳口、地上的十片","beat":"掀开 → 拔出 → 她试着握拳，握不上","term":"爪剥ぎ（tsumehagi）/ 拔甲，nail torture","origin":"拷问史中的指甲刑；日本「爪剥ぎ」是 ryona 的经典小项","explain":"指甲是人体末端神经密度最高的地方之一，面积最小，痛感最集中。它的独特之处是「功能可见性」：拔掉之后，她连握拳、抓东西、开瓶盖都做不到，而这个能力的丧失每天都看得见。与针刺的区别是永久性——针孔会愈，甲床损伤不可逆。写这个题材不要写痛，写她之后试图握住一样东西、握不住的那三秒。"},{"n":66,"id":"DILATION","name":"过度扩张","core":"孔洞被撑到解剖学的极限之外，然后继续。","axes":{"BODY":2,"PROX":2,"POC":1},"hooks":["DILATE","WOUND_SEX","MEDICAL","WET"],"scene":"拳、器械、被撑到发白的边缘","beat":"进入 → 再加 → 那里不再能合上","term":"過度な拡張 / 扩张，フィスト，stretching","origin":"F-List 的 stretching / fisting；日本「拡張」系","explain":"与膨胀的区别在方向：膨胀往体腔内灌入物质（体积增加），扩张是把孔洞本身撑到解剖极限之外（孔径增加）。它的核心恐怖是「不可逆」——括约肌与黏膜被撑开之后会失去回弹，那里从此合不上。这就是它比插入类题材更狠的地方：不只是被使用过，是被改造成了「一直开着的状态」。"},{"n":67,"id":"THROAT","name":"深喉与食道","core":"喉咙是一条管子。它被当成管子用的时候，呼吸是别人的。","axes":{"BODY":2,"POC":2,"PROX":1},"hooks":["THROAT","STRANGLE","VOMIT","INCONT"],"scene":"颈部的凸起、不行了的手势、被按住的后脑","beat":"推进 → 干呕 → 他等她适应，再继续","term":"イラマチオ（irrumatio）/ 深喉，食道オナホ","origin":"拉丁语 irrumare（把阴茎塞进对方嘴里）与日本「イラマチオ」；「食道オナホ」是同人圈对食管被作为管道使用的称呼","explain":"喉咙是人体唯一一条「同时属于呼吸与进食」的通道，因此它被占用时，呼吸权就直接交给了对方。这与绞杀的区别是「由谁控制」：绞杀用手，深喉用器官本身。「食道オナホ」这个词点出了它的本质——把整条消化道当成一个可以贯穿的套筒。写法上别写「她很难受」，要写「她在等他把手松开，好知道下一口气什么时候来」。"},{"n":68,"id":"ANESTHESIA","name":"麻醉","core":"全程清醒，只是感觉不到。她看着自己被打开。","axes":{"MIND":2,"BODY":2,"AES":1},"hooks":["ANESTH","MEDICAL","AMPUTATE","DEPRIVE"],"scene":"无影灯、说不出口的嘴、自己抬不起来的手","beat":"注射 → 看着刀落下 → 没有痛，只有位移感","term":"麻酔（masui）/ 无痛切割，anesthesia play","origin":"外科麻醉史；日本 ryona 分类里单列为「麻酔（例：痛覚の無い状態での四肢切断）」","explain":"这是全部题材里唯一「没有痛觉」的一个，而它恰恰比有痛更恐怖。痛觉的功能是让人知道「有事发生」，麻醉剥夺了这个警报——她会亲眼看着自己被打开，却收不到任何身体信号，于是「发生了什么」只能靠视觉推断。与感官剥夺的区别是：剥夺拿走的是输入（看不见听不见），麻醉拿走的是输出（感觉不到）。这一类在分类学里常被标为「精神リョナ」，因为它伤害的是「对自己身体的信任」。"}],"taboos":[{"k":"BLOOD","n":"血 / 伤口 / 见血的疼","hooks":["AMPUTATE","DISFIGURE","NEEDLE","REGICIDE"]},{"k":"CORPSE","n":"尸体 / 与死者有关的事（不含腐烂）","hooks":["DEFILE_BODY","CORPSE_BRIDE","CORPSE_WET","TAXIDERM"]},{"k":"PUTREFY","n":"腐烂 / 腐朽 / 分解","hooks":["ROT"]},{"k":"PREGNANT","n":"怀孕 / 生产 / 流产","hooks":["PREGNANT","BIRTH","MISCARRIAGE","INFANT"]},{"k":"KIN","n":"亲缘 / 家人之间","hooks":["INCEST"]},{"k":"CHILD","n":"幼体在场 / 未成年","hooks":["INFANT"]},{"k":"BEAST","n":"兽交 / 异种","hooks":["BEAST","INSECT"]},{"k":"PUBLIC","n":"公开 / 被看见 / 围观","hooks":["WITNESS","SERVANT"]},{"k":"SUBMIT","n":"被剥夺意志 / 催眠 / 洗脑","hooks":["SILENCE","SELF"]},{"k":"HUMILIATE","n":"排泄 / 污物（不含体液）","hooks":["INCONT"]}],"softTaboos":[{"k":"NO_SEX","n":"不要性的部分（只要暴力、恐怖与权力）","axis":"PROX"},{"k":"NO_ROMANCE","n":"不要内在戏（只要外部实况与制度）","axis":"MIND"}],"scenes":["古代宫廷 / 王朝","当代都市","近未来 / 机构","乡土 / 荒野","无明确地点"],"relations":["血亲","配偶 / 契约","主仆 / 上对下","陌生 / 捕获","敌我","自己与另一个自己"],"povs":["施害者","受害者","旁观者","双线交替"],"tones":["冷叙述（档案体）","慢镜（生理实况）","诗性（意象稠密）","白描（不修饰）"],"lengths":["短篇（单场景）","中篇（三到五幕）","章节（长篇的一段）"],"shape":["一次到底（单场景，冲到最高再停）","长期日常（同样的伤口重复发生很多次）"],"ending":["死（死是那一声钝响）","活（活下来才是更长的刑）","随便，看情节走到哪"]};
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className = c; if(h!=null) e.innerHTML = h; return e; };

const S = {
  step: 0,
  main: [], soft: [], hooks: [], taboos: [], softTaboos: [],
  scene: null, relation: null, pov: null, tone: null, length: null,
  shape: null, ending: null
};

const AX = {}; D.axes.forEach(a => AX[a.k] = a.n);
const HK = {}; D.hooks.forEach(h => HK[h.k] = h.n);
const TX = {}; D.topics.forEach(t => TX[t.id] = t);

/* ---------------- 渲染 ---------------- */

function optRow(i, title, sub, on, onClick, single) {
  const d = el("div", "opt" + (on ? " on" : ""));
  d.dataset.i = String(i);
  d.appendChild(el("span", "idx", String(i).padStart(2, "0")));
  const txt = el("span", "txt", title + (sub ? `<span class="sub">${sub}</span>` : ""));
  d.appendChild(txt);
  d.appendChild(el("span", "mark"));
  d.onclick = onClick;
  return d;
}

function counter(id, cur, min, max) {
  return el("div", "counter", `已选 <b>${cur}</b>` + (max ? ` / 上限 ${max}` : "") + (min ? `　需 ${min}` : ""));
}

function qBlock(n, title, hint) {
  const box = el("div", "q");
  box.dataset.q = String(n);
  box.appendChild(el("div", "qh", `<span class="qn">${n}</span><span class="qt">${title}</span>`));
  if (hint) box.appendChild(el("div", "qq", hint));
  return box;
}

function renderStep() {
  const app = $("#app");
  app.innerHTML = "";

  if (S.step === 0) return cover(app);
  if (S.step === 5) return result(app);

  const head = el("div", "stephead");
  head.appendChild(el("span", "steptag", ["", "第一轮 / 四", "第二轮 / 四", "第三轮 / 四", "第四轮 / 四"][S.step]));
  head.appendChild(el("h2", "", ["", "你被什么击中", "划掉不吃的东西", "成品配方", "定盘"][S.step]));
  app.appendChild(head);
  app.appendChild(el("div", "stepdesc", [
    "",
    "不问「你喜欢哪个题材」——那个问题没有人答得出真话。这里问的是你在哪几根轴上被击中。",
    "先把不能碰的划掉，剩下的排序才有意义。硬禁区整类作废，软偏好只往后压。",
    "同一题材，宫廷版和都市版是两个东西。这一轮决定成品的形状。",
    "最后两个决定：这一篇要多长一口气，结尾能不能死人。"
  ][S.step]));

  if (S.step === 1) step1(app);
  if (S.step === 2) step2(app);
  if (S.step === 3) step3(app);
  if (S.step === 4) step4(app);

  app.appendChild(navBar());
}

function cover(app) {
  const c = el("div", "step cover");
  c.innerHTML = `
    <div class="kicker">R18G 题材定位 · 题库 v2</div>
    <h1 class="serif">先量出你的<em>坐标</em>，<br>再谈写什么。</h1>
    <p class="lead">
      十二道题，四轮。它不问你「喜欢哪个题材」——没有人答得出来，
      人会挑自己觉得有品位的黑暗，避开让自己真的不适的那些，而后者恰恰常是真正的点。
      所以这里问的是：你在哪几根轴上被击中，又绝对不能碰什么。
      答完，68 个题材按你的坐标重排，每个都附名词解释。
    </p>
    <div class="meta">
      <div><b>${D.topics.length}</b>题材</div>
      <div><b>${D.hooks.length}</b>钩子</div>
      <div><b>${D.axes.length}</b>轴</div>
      <div><b>12</b>题 / 约 2 分钟</div>
    </div>
    <div class="startrow">
      <button class="btn" id="btnStart">开始</button>
      <button class="btn ghost" id="btnAtlas">先看全部题材与解释</button>
    </div>
    <p class="note" style="margin-top:26px">
      全部内容留在本机浏览器里，不上传、不保存。关掉页面即清空。<br>
      所有角色与情节均为虚构，用于创作前的选题定位。
    </p>`;
  app.appendChild(c);
  document.getElementById("btnStart").addEventListener("click", () => go(1));
  document.getElementById("btnAtlas").addEventListener("click", () => go("atlas"));
}

function step1(app) {
  // Q1 主轴
  const q1 = qBlock("01", "七根轴里，选 <b>2</b> 根最狠的", "选两根，不要多。多选会让排序失效。");
  const o1 = el("div", "opts");
  D.axes.forEach((a, i) => {
    o1.appendChild(optRow(i + 1, a.n, a.d, S.main.includes(a.k), () => {
      const k = a.k, at = S.main.indexOf(k);
      if (at >= 0) S.main.splice(at, 1);
      else { if (S.main.length >= 2) S.main.shift(); S.main.push(k); }
      renderStep();
    }));
  });
  q1.appendChild(o1);
  q1.appendChild(counter("c1", S.main.length, 2, 2));
  app.appendChild(q1);

  // Q2 副轴
  const left = D.axes.filter(a => !S.main.includes(a.k));
  const q2 = qBlock("02", "还有哪些你也吃得下（最多 <b>3</b> 根，可空）", "副轴按 1.5 倍计权，不选也行。");
  const o2 = el("div", "opts");
  left.forEach((a, i) => {
    o2.appendChild(optRow(i + 1, a.n, a.d, S.soft.includes(a.k), () => {
      const k = a.k, at = S.soft.indexOf(k);
      if (at >= 0) S.soft.splice(at, 1);
      else { if (S.soft.length >= 3) S.soft.shift(); S.soft.push(k); }
      renderStep();
    }));
  });
  q2.appendChild(o2);
  q2.appendChild(counter("c2", S.soft.length, 0, 3));
  app.appendChild(q2);

  // Q3 钩子（按组分栏）
  const q3 = qBlock("03", "下面这些具体的画面，哪几样会让你坐直（<b>2 到 5 个</b>）",
    "钩子是最小单位的画面元件。选具体的，不选听起来高级的。");
  D.hookGroups.forEach(grp => {
    const g = el("div", "hgroup");
    g.appendChild(el("div", "gtitle", grp.g));
    const o = el("div", "opts grid2");
    grp.hooks.forEach(hk => {
      const h = D.hooks.find(x => x.k === hk);
      if (!h) return;
      const row = el("div", "opt" + (S.hooks.includes(hk) ? " on" : ""));
      row.appendChild(el("span", "mark"));
      row.appendChild(el("span", "txt", h.n));
      row.onclick = () => {
        const at = S.hooks.indexOf(hk);
        if (at >= 0) S.hooks.splice(at, 1);
        else { if (S.hooks.length >= 5) S.hooks.shift(); S.hooks.push(hk); }
        renderStep();
      };
      o.appendChild(row);
    });
    g.appendChild(o);
    q3.appendChild(g);
  });
  q3.appendChild(counter("c3", S.hooks.length, 2, 5));
  app.appendChild(q3);
}

function step2(app) {
  const q4 = qBlock("04", "硬禁区 —— 踩中就整类作废（可多选，可空）",
    "这条权重比偏好高 3.5 倍。宁可错杀一个匹配，也不要给你一个读到一半想关掉的东西。");
  const o4 = el("div", "opts grid2");
  D.taboos.forEach((t, i) => {
    o4.appendChild(optRow(i + 1, t.n, null, S.taboos.includes(t.k), () => {
      const at = S.taboos.indexOf(t.k);
      if (at >= 0) S.taboos.splice(at, 1); else S.taboos.push(t.k);
      renderStep();
    }));
  });
  q4.appendChild(o4);
  app.appendChild(q4);

  const q5 = qBlock("05", "软偏好 —— 不吃但不必废掉整个题材（可多选，可空）",
    "软偏好不否决，只把对应的那根轴压到 45% / 20%。");
  const o5 = el("div", "opts grid2");
  D.softTaboos.forEach((t, i) => {
    o5.appendChild(optRow(i + 1, t.n, "压：" + AX[t.axis], S.softTaboos.includes(t.k), () => {
      const at = S.softTaboos.indexOf(t.k);
      if (at >= 0) S.softTaboos.splice(at, 1); else S.softTaboos.push(t.k);
      renderStep();
    }));
  });
  q5.appendChild(o5);
  app.appendChild(q5);
}

function singleQ(app, no, title, hint, list, key) {
  const b = qBlock(no, title, hint);
  const o = el("div", "opts");
  list.forEach((v, i) => o.appendChild(optRow(i + 1, v, null, S[key] === i, () => { S[key] = i; renderStep(); })));
  b.appendChild(o);
  app.appendChild(b);
}

function step3(app) {
  singleQ(app, "06", "场景 —— 故事发生在哪", null, D.scenes, "scene");
  singleQ(app, "07", "关系 —— 动手的与承受的是什么关系", null, D.relations, "relation");
  singleQ(app, "08", "视角 —— 镜头放在谁身上", null, D.povs, "pov");
  singleQ(app, "09", "笔法 —— 用哪种舌头说这件事", null, D.tones, "tone");
  singleQ(app, "10", "长度 —— 这次要多大一块", null, D.lengths, "length");
}

function step4(app) {
  singleQ(app, "11", "这一次，你要的是哪一种落法", "同一题材，单场景冲到顶，和日常化重复，是两篇完全不同的文。", D.shape, "shape");
  singleQ(app, "12", "结尾允许死吗", null, D.ending, "ending");
}

function navBar() {
  const n = el("div", "nav");
  const ok = canNext();
  const hint = el("div", "hint" + (ok ? "" : " bad"), needText());
  n.appendChild(hint);
  if (S.step > 1) {
    const b = el("button", "btn ghost", "上一步");
    b.onclick = () => go(S.step - 1);
    n.appendChild(b);
  }
  const nx = el("button", "btn", S.step === 4 ? "算结果" : "下一步");
  nx.disabled = !ok;
  nx.onclick = () => { if (ok) go(S.step === 4 ? 5 : S.step + 1); };
  n.appendChild(nx);
  return n;
}

function canNext() {
  if (S.step === 1) return S.main.length === 2 && S.hooks.length >= 2;
  if (S.step === 2) return true;
  if (S.step === 3) return [S.scene, S.relation, S.pov, S.tone, S.length].every(v => v !== null);
  if (S.step === 4) return S.shape !== null && S.ending !== null;
  return true;
}

function needText() {
  if (S.step === 1) {
    const a = [];
    if (S.main.length !== 2) a.push("主轴还差 " + (2 - S.main.length) + " 根");
    if (S.hooks.length < 2) a.push("钩子至少 2 个");
    return a.length ? "还差：" + a.join("，") : "可以继续";
  }
  if (S.step === 3) {
    const rest = [["场景", S.scene], ["关系", S.relation], ["视角", S.pov], ["笔法", S.tone], ["长度", S.length]]
      .filter(x => x[1] === null).map(x => x[0]);
    return rest.length ? "还差：" + rest.join("、") : "可以继续";
  }
  if (S.step === 4) {
    const rest = [["落法", S.shape], ["结尾", S.ending]].filter(x => x[1] === null).map(x => x[0]);
    return rest.length ? "还差：" + rest.join("、") : "可以继续";
  }
  return "";
}

/* ---------------- 打分（与 r18g_quiz.py 等价） ---------------- */

function scoreAll() {
  const main = new Set(S.main), soft = new Set(S.soft), hooks = new Set(S.hooks);
  const tabooHooks = new Set();
  S.taboos.forEach(k => { const t = D.taboos.find(x => x.k === k); if (t) t.hooks.forEach(h => tabooHooks.add(h)); });
  const damp = {};
  S.softTaboos.forEach(k => { const t = D.softTaboos.find(x => x.k === k); if (t) damp[t.axis] = (damp[t.axis] || 0) + 1; });

  const rows = D.topics.map(t => {
    let s = 0, full = [];
    for (const ax in t.axes) {
      const w = t.axes[ax];
      let mult = 1;
      if (damp[ax]) mult = damp[ax] === 1 ? 0.45 : 0.2;
      if (main.has(ax)) { s += w * 3 * mult; if (w >= 2 && mult === 1) full.push(AX[ax]); }
      else if (soft.has(ax)) s += w * 1.5 * mult;
      else if (w > 0) s += w * 0.5 * mult;
    }
    const hit = t.hooks.filter(h => hooks.has(h));
    s += hit.length * 2;
    const veto = t.hooks.filter(h => tabooHooks.has(h));
    s -= veto.length * 7;
    const why = [];
    if (full.length) why.push("主轴上满格：" + full.join("、"));
    if (hit.length) why.push("命中钩子：" + hit.map(h => HK[h]).join("、"));
    if (veto.length) why.push("踩禁区：" + veto.map(h => HK[h]).join("、"));
    return { t, s, why, veto: veto.length > 0, hit };
  });

  rows.sort((a, b) => (b.s - a.s) || a.t.id.localeCompare(b.t.id));
  return rows;
}

/* ---------------- 结果 ---------------- */

function result(app) {
  const rows = scoreAll();
  const usable = rows.filter(r => !r.veto);
  const top = usable.slice(0, 8);
  const lo = Math.min(...rows.map(r => r.s));
  const hi = Math.max(...rows.map(r => r.s));

  const w = el("div", "res");
  w.innerHTML = `<h2 class="serif">你的坐标</h2>
    <div class="sub">按这套坐标，${D.topics.length} 个题材重排如下。点任意一行展开名词解释。</div>`;

  // 坐标
  const co = el("div", "coords");
  const put = (k, v) => co.appendChild(el("div", "", `<dt>${k}</dt><dd>${v}</dd>`));
  put("主轴", S.main.map(k => AX[k]).join(" ／ "));
  put("副轴", S.soft.length ? S.soft.map(k => AX[k]).join(" ／ ") : "—");
  put("钩子", S.hooks.length ? S.hooks.map(k => HK[k]).join(" ／ ") : "—");
  put("硬禁区", S.taboos.length ? S.taboos.map(k => D.taboos.find(x => x.k === k).n).join(" ／ ") : "无");
  put("软偏好", S.softTaboos.length ? S.softTaboos.map(k => D.softTaboos.find(x => x.k === k).n).join(" ／ ") : "无");
  put("落法", D.shape[S.shape] + " ／ 结尾：" + D.ending[S.ending]).innerHTML;
  w.appendChild(co);

  if (!top.length) {
    w.appendChild(el("div", "card", `<span style="color:var(--red2)">禁区把所有题材都划掉了。</span>
      <div class="note" style="margin-top:8px">要么回上一步放松一条，要么这些真的不是你的场子。</div>`));
    const acts = el("div", "acts");
    const b = el("button", "btn", "回上一步");
    b.onclick = () => go(2);
    acts.appendChild(b);
    w.appendChild(acts);
    app.appendChild(w);
    return;
  }

  // 排序
  w.appendChild(el("h2", "serif", "题材排序")).style.marginTop = "40px";
  w.appendChild(el("div", "sub", "分数不是绝对值，是相对你的坐标的匹配度。前几名差 1.5 分以内基本同权。"));
  const list = el("div", "rank");

  top.forEach((r, i) => {
    const row = el("div", "row");
    const head = el("div", "rowhead");
    head.innerHTML = `<span class="rk">${String(i + 1).padStart(2, "0")}</span>
      <span class="rname serif">${r.t.name}</span>
      <span class="rterm">${r.t.term}</span>
      <span class="rscore">${r.s.toFixed(1)}</span>`;
    const pct = hi > lo ? ((r.s - lo) / (hi - lo)) * 100 : 0;
    const bar = el("div", "rbar", `<i></i>`);
    row.appendChild(head);
    row.appendChild(bar);
    row.appendChild(el("div", "rcore", r.t.core));
    if (r.why.length) row.appendChild(el("div", "rwhy", r.why.join("；")));

    const exp = el("div", "exp");
    exp.innerHTML = `
      <div class="lab">术语</div><div class="val">${r.t.term}</div>
      <div class="lab">来历</div><div class="val">${r.t.origin}</div>
      <div class="lab">解释</div><div class="val txt">${r.t.explain}</div>
      <div class="lab">原生场景</div><div class="val">${r.t.scene}</div>
      <div class="lab">结构三拍</div><div class="val">${r.t.beat}</div>`;
    row.appendChild(exp);

    head.onclick = () => exp.classList.toggle("open");
    list.appendChild(row);
    setTimeout(() => { bar.firstChild.style.width = pct + "%"; }, 60 + i * 55);
  });
  w.appendChild(list);

  // 定盘
  const best = top[0].t;
  let rec = best.hooks.filter(h => S.hooks.includes(h));
  if (!rec.length) rec = best.hooks.slice(0, 3);

  w.appendChild(el("h2", "serif", "首选定盘")).style.marginTop = "40px";
  const pick = el("div", "card pick");
  pick.innerHTML = `
    <div class="lab2">OPENING SHEET</div>
    <h3 class="serif">${best.name}</h3>
    <div style="font-size:11.5px;color:var(--gold);margin-bottom:14px">${best.term}</div>
    <div class="core">${best.core}</div>
    <div class="tbl">
      <dt>原生场景</dt><dd>${best.scene}</dd>
      <dt>结构三拍</dt><dd>${best.beat}</dd>
      <dt>必带钩子</dt><dd>${rec.map(h => HK[h]).join("、")}</dd>
      <dt>配方</dt><dd>${D.scenes[S.scene]} ／ ${D.relations[S.relation]} ／ ${D.povs[S.pov]}视角 ／ ${D.tones[S.tone]} ／ ${D.lengths[S.length]}</dd>
      <dt>落法</dt><dd>${D.shape[S.shape]}</dd>
      <dt>结尾</dt><dd>${D.ending[S.ending]}</dd>
    </div>
    <div class="todo">
      <li>三个必须写到的细节，照这个密度写，不许抽象</li>
      <li>每一段都有身体实况，没有一句是作者在评价</li>
      <li>承受者有自己的内在，不只是道具</li>
      <li>结尾没有救赎，情节自己耗尽</li>
    </div>`;
  w.appendChild(pick);

  if (top.length > 1) {
    const alt = el("div", "card");
    alt.innerHTML = `<div class="note" style="margin-bottom:10px">次选搭子（做副线，或下一轮重跑时换这一组轴）</div>
      <div style="font-size:14px">${top.slice(1, 4).map(r => `<span class="serif" style="font-size:16px">${r.t.name}</span>
        <span style="color:var(--dim2);font-size:12px">　${r.t.term}</span>`).join("<br>")}</div>`;
    w.appendChild(alt);
  }

  const vetoed = rows.filter(r => r.veto).slice(0, 5);
  if (vetoed.length) {
    const v = el("div", "card vetoed");
    v.innerHTML = `<div class="note" style="margin-bottom:8px">被禁区划掉的（看一眼，确认没有划得太狠）</div>` +
      vetoed.map(r => `<b>${r.t.name}</b>　${r.why[r.why.length - 1] || "命中硬禁区"}`).join("<br>");
    w.appendChild(v);
  }

  const acts = el("div", "acts");
  const b1 = el("button", "btn ghost", "重新作答");
  b1.onclick = reset;
  const b2 = el("button", "btn ghost", "复制结果");
  b2.onclick = () => copyResult(rows, top, best, rec, b2);
  const b3 = el("button", "btn ghost", "看全部题材");
  b3.onclick = () => go("atlas");
  acts.append(b1, b2, b3);
  w.appendChild(acts);

  app.appendChild(w);
}

function copyResult(rows, top, best, rec, btn) {
  const L = [];
  L.push("# R18G 选题结果\n");
  L.push("## 坐标");
  L.push("- 主轴：" + S.main.map(k => AX[k]).join(" / "));
  L.push("- 副轴：" + (S.soft.map(k => AX[k]).join(" / ") || "—"));
  L.push("- 钩子：" + (S.hooks.map(k => HK[k]).join(" / ") || "—"));
  L.push("- 硬禁区：" + (S.taboos.map(k => D.taboos.find(x => x.k === k).n).join(" / ") || "无"));
  L.push("- 软偏好：" + (S.softTaboos.map(k => D.softTaboos.find(x => x.k === k).n).join(" / ") || "无"));
  L.push("\n## 排序");
  top.forEach((r, i) => {
    L.push(`${i + 1}. **${r.t.name}**（${r.s.toFixed(1)}）— ${r.t.term}`);
    L.push(`   - ${r.t.core}`);
    if (r.why.length) L.push("   - " + r.why.join("；"));
  });
  L.push("\n## 开工单");
  L.push("- 定盘：" + best.name);
  L.push("- 核：" + best.core);
  L.push("- 场景：" + best.scene);
  L.push("- 三拍：" + best.beat);
  L.push("- 钩子：" + rec.map(h => HK[h]).join("、"));
  L.push(`- 配方：${D.scenes[S.scene]} ／ ${D.relations[S.relation]} ／ ${D.povs[S.pov]}视角 ／ ${D.tones[S.tone]} ／ ${D.lengths[S.length]}`);
  L.push("- 落法：" + D.shape[S.shape] + "；结尾：" + D.ending[S.ending]);

  const txt = L.join("\n");
  const done = () => { const o = btn.textContent; btn.textContent = "已复制"; setTimeout(() => btn.textContent = o, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}

function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------------- 全谱 ---------------- */

function atlas(app) {
  const w = el("div", "atlas");
  w.innerHTML = `<div class="stephead"><span class="steptag">附录</span><h2 class="serif">题材全谱 · ${D.topics.length}</h2></div>
    <div class="stepdesc">每一题材的轴坐标、钩子、名词解释与结构三拍。搜索名称或术语可过滤。</div>`;

  const inp = el("input", "");
  inp.placeholder = "搜索题材名、术语、关键词……";
  w.appendChild(inp);
  const box = el("div", "");
  w.appendChild(box);

  const draw = (kw) => {
    box.innerHTML = "";
    const q = kw.trim().toLowerCase();
    D.topics.forEach(t => {
      const hay = (t.name + t.term + t.explain + t.core + Object.keys(t.axes).map(k => AX[k]).join("")).toLowerCase();
      if (q && !hay.includes(q)) return;
      const it = el("div", "aitem");
      it.innerHTML = `<h4 class="serif">${String(t.n).padStart(2, "0")}　${t.name}</h4>
        <div class="term">${t.term}</div>
        <div class="ex">${t.explain}</div>
        <div class="ax">${Object.keys(t.axes).map(k => AX[k] + (t.axes[k] > 0 ? "+" : "") + t.axes[k]).join("　")}
          ｜ ${t.hooks.map(h => HK[h]).join("、")}</div>`;
      box.appendChild(it);
    });
    if (!box.children.length) box.innerHTML = `<div class="note">没有匹配的题材。</div>`;
  };
  inp.oninput = () => draw(inp.value);
  draw("");

  const acts = el("div", "acts");
  const b = el("button", "btn ghost", "回到问卷");
  b.onclick = () => go(S.step === 0 ? 0 : S.step);
  acts.appendChild(b);
  w.appendChild(acts);
  app.appendChild(w);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------------- 路由 ---------------- */

let lastStep = 0;

function go(step) {
  if (step === "atlas") {
    lastStep = S.step;
    $("#app").innerHTML = "";
    atlas($("#app"));
    updateBar(-1);
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  S.step = step;
  updateBar(step);
  renderStep();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function reset() {
  S.step = 0;
  S.main = []; S.soft = []; S.hooks = []; S.taboos = []; S.softTaboos = [];
  S.scene = S.relation = S.pov = S.tone = S.length = S.shape = S.ending = null;
  updateBar(0);
  renderStep();
}

function updateBar(step) {
  const pct = step <= 0 ? 0 : step >= 5 ? 100 : (step / 4) * 100;
  $("#pbar").style.width = pct + "%";
  document.title = "R18G 题材定位 · " + (step <= 0 ? "封面" : step >= 5 ? "结果" : "第 " + step + " 步 / 4");
  $("#topbtn").textContent = step >= 5 ? "看全谱" : "题材全谱";
  $("#topbtn").onclick = () => go("atlas");
}

updateBar(0);
renderStep();
</script>
